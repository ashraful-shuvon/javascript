<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-800">
    <section class="min-h-screen bg-gray-200 max-w-screen-sm mx-auto">
        <header>
            <nav class="flex justify-between items-center p-7">
                <div class="flex justify-center items-center gap-3">
                    <img class="w-12" src="./Payoo-MFS-Resources/assets/Group.png" alt="">
                    <div>
                        <h1 class="text-xl font-bold ">$ <span id="mainBalance">45000</span></h1>
                        <p class="text-sm text-opacity-50 font-normal">Available balance</p>
                    </div>
                </div>
                <button class="btn px-7 rounded-lg border-gray-400">Logout</button>
            </nav>
            <hr class="border-t border-gray-400 w-full">
            <section class="p-7">
                <h1 class="text-2xl font-bold ">🔥 Welcome to Payooo!</h1>
                <p class="font-normal text-base opacity-50 mt-3">Enjoy easy and convenient financial services with us.
                    Cashout charge is low and</p>
            </section>

            <!-- cards -->
            <section class="p-7 grid grid-cols-3 gap-6">
                <div id="addMoney-box"
                    class="bg-white flex rounded-lg border-2 border-gray-300 hover:translate-y-1 hover:duration-300">
                    <div class="p-4 mx-auto gap-3 flex flex-col justify-center items-center">
                        <img class="w-8" src="./Payoo-MFS-Resources/assets/wallet1.png" alt="">
                        <p class="text-base font-normal opacity-50">Add money</p>
                    </div>
                </div>
                <div id="cashout-box"
                    class="bg-white flex rounded-lg border-2 border-gray-300 hover:translate-y-1 hover:duration-300">
                    <div class="p-4 mx-auto gap-3 flex flex-col justify-center items-center">
                        <img class="w-8" src="./Payoo-MFS-Resources/assets/send1.png" alt="">
                        <p class="text-base font-normal opacity-50 ">Cashout</p>
                    </div>
                </div>
                <div class="bg-white flex rounded-lg border-2 border-gray-300 hover:translate-y-1 hover:duration-300">
                    <div class="p-4 mx-auto gap-3 flex flex-col justify-center items-center">
                        <img class="w-8" src="./Payoo-MFS-Resources/assets/money1.png" alt="">
                        <p class="text-base font-normal opacity-50 text-center">Money transfer</p>
                    </div>
                </div>
                <div class="bg-white flex rounded-lg border-2 border-gray-300 hover:translate-y-1 hover:duration-300">
                    <div class="p-4 mx-auto gap-3 flex flex-col justify-center items-center">
                        <img class="w-8" src="./Payoo-MFS-Resources/assets/bonus1.png" alt="">
                        <p class="text-base font-normal opacity-50">Get bonus</p>
                    </div>
                </div>
                <div class="bg-white flex rounded-lg border-2 border-gray-300 hover:translate-y-1 hover:duration-300">
                    <div class="p-4 mx-auto gap-3 flex flex-col justify-center items-center">
                        <img class="w-8" src="./Payoo-MFS-Resources/assets/purse1.png" alt="">
                        <p class="text-base font-normal opacity-50">Pay bill</p>
                    </div>
                </div>
                <div id="transaction-box"
                    class="bg-white flex rounded-lg border-2 border-gray-300  hover:translate-y-1 hover:duration-300">
                    <div class="p-4 mx-auto gap-3 flex flex-col justify-center items-center">
                        <img class="w-8" src="./Payoo-MFS-Resources/assets/transaction1.png" alt="">
                        <p class="text-base font-normal opacity-50">Transactions</p>
                    </div>
                </div>

            </section>
        </header>
        <main>
            <section id="addMoney-card">
                <h1 class="px-7 text-xl font-bold text-blue-500">Add money</h1>
                <div class="">
                    <div class="hero-content">
                        <div class="card w-full max-w-xl shrink-0 shadow-2xl ">
                            <div class="card-body">
                                <legend>Select Bank</legend>
                                <select class="select select-primary w-full">
                                    <option disabled selected>Select Bank</option>
                                    <option value="bkash">BKash</option>
                                    <option value="nagad">Nagad</option>
                                    <option value="">Rocket</option>
                                </select>
                                <fieldset class="fieldset">
                                    <label class="label">Account number</label>
                                    <input id="ac-num" value="01950506095" type="number" class="input w-full"
                                        placeholder="AC number" />
                                    <label class="label">Enter ammount</label>
                                    <input id="ammount" type="number" class="input w-full" placeholder="Enter ammout" />
                                    <label class="label">PIN</label>
                                    <input id="pin-num" value="1234" type="text" class="input w-full"
                                        placeholder="PIN" />
                                    <div><a class="link link-hover">Forgot password?</a></div>
                                    <button id="addMoney" class="btn btn-neutral bg-blue-500 mt-4">Add money</button>
                                </fieldset>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section id="cashout-card">
                <h2 class="px-7 text-xl text-blue-500 font-bold">Cashout</h2>

                <div class="">
                    <div class="hero-content">
                        <div class="card w-full max-w-xl shrink-0 shadow-2xl ">
                            <div class="card-body">

                                <fieldset class="fieldset">
                                    <label class="label">Account number</label>
                                    <input id="ac-num" value="01950506095" type="number" class="input w-full"
                                        placeholder="AC number" />
                                    <label class="label">Enter ammount</label>
                                    <input id="cashout-ammount" type="number" class="input w-full"
                                        placeholder="Enter ammout" />
                                    <label class="label">PIN</label>
                                    <input id="cashout-pin" value="1234" type="text" class="input w-full"
                                        placeholder="PIN" />
                                    <div><a class="link link-hover">Forgot password?</a></div>
                                    <button id="cashout-btn" class="btn btn-neutral bg-blue-500 mt-4">Cashout</button>
                                </fieldset>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section id="transaction-card">
                <h1 class="p-7 text-xl text-blue-500 font-bold">Transactions history</h1>

            </section>
        </main>
    </section>

    <script src="./script/transaction.js"></script>
    <script src="./utilities/utilities.js"></script>
    <script src="./utilities/toggle.js"></script>
    <script src="./script/addMoney.js"></script>
    <script src="./script/cashout.js"></script>
</body>

</html>
